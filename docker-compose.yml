name: rag-demo

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PG18 images keep data in a versioned subdirectory of /var/lib/postgresql
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.42.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost on purpose: Docker bypasses ufw/iptables rules.
      # Change to "5678:5678" only on a trusted network.
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./manuales:/files/manuales:ro
      - ./workflows:/workflows:ro
    mem_limit: 700m

volumes:
  db-data:
  n8n-data:
